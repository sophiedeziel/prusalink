name: Linter and Type Checker

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  sorbet:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Ruby and gems
      uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
      with:
        bundler-cache: true

    - name: Run Sorbet
      run: bundle exec srb tc

  rubocop:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Ruby and gems
      uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
      with:
        bundler-cache: true

    - name: Run Rubocop
      run: bundle exec rubocop --format github

  tapioca:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Ruby and gems
      uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
      with:
        bundler-cache: true

    - name: Verify Tapioca RBI files are up to date
      run: bin/tapioca dsl --verify

    - name: Verify the exported gem RBI is up to date
      run: bundle exec rake rbi:check
